$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
command: >-
  python train_yolo.py --detection_data ${{inputs.detection_data}} --segmentation_data ${{inputs.segmentation_data}}

experiment_name: yolo-training-experiment
compute: cadaidcompute
environment: azureml:yolo-training-environment

inputs:
  detection_data:
    type: uri_folder
    path: azureml://datastores/workspaceblobstore/paths/data
  segmentation_data:
    type: uri_folder
    path: azureml://datastores/workspaceblobstore/paths/data_seg

outputs: {}

