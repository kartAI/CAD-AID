
name: cadaid-api-multicontainer
apiVersion: '2021-10-01'
location: westeurope
properties:
  containers:
    - name: detect
      properties:
        image: cadaidregistry.azurecr.io/detect:latest
        ports:
          - port: 8000
        resources:
          requests:
            cpu: 2
            memoryInGB: 4
          limits:
            cpu: 4
            memoryInGB: 8
        livenessProbe:
          httpget:
            path: /health
            port: 8000
          initialDelaySeconds: 120
          periodSeconds: 60
          timeoutSeconds: 60
          successThreshold: 1
          failureThreshold: 10
        readinessProbe:
          httpget:
            path: /health
            port: 8000
          initialDelaySeconds: 120
          periodSeconds: 60
          timeoutSeconds: 60
        environmentVariables:
          - name: STATIC_API_KEY
            secureValue: 'yx9D8EfFrMMXRjilmgvZP6P6pAIo8R2o7f_XZGzS614'
    - name: feedback
      properties:
        image: cadaidregistry.azurecr.io/feedback:latest
        ports:
          - port: 8001
        resources:
          requests:
            cpu: 1.5
            memoryInGB: 3
          limits:
            cpu: 3
            memoryInGB: 6
        livenessProbe:
          httpget:
            path: /health
            port: 8001
          initialDelaySeconds: 120
          periodSeconds: 60
          timeoutSeconds: 60
          successThreshold: 1
          failureThreshold: 10
        readinessProbe:
          httpget:
            path: /health
            port: 8001
          initialDelaySeconds: 120
          periodSeconds: 60
          timeoutSeconds: 60
        environmentVariables:
          - name: STATIC_API_KEY
            secureValue: 'yx9D8EfFrMMXRjilmgvZP6P6pAIo8R2o7f_XZGzS614'
    - name: nginx
      properties:
        image: cadaidregistry.azurecr.io/nginx:latest
        ports:
          - port: 80
        resources:
          requests:
            cpu: 0.5
            memoryInGB: 1
          limits:
            cpu: 1
            memoryInGB: 2
        livenessProbe:
          httpget:
            path: /detect/health
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
  osType: Linux
  ipAddress:
    type: Public
    ports:
      - protocol: tcp
        port: 80
    dnsNameLabel: cadaid-api
  restartPolicy: Always

  # Log Analytics configuration
  diagnostics:
    logAnalytics:
      workspaceId: ${LOG_ANALYTICS_WORKSPACE_ID}
      workspaceKey: ${LOG_ANALYTICS_WORKSPACE_KEY}
      logType: ContainerInsights

  imageRegistryCredentials:
    - server: cadaidregistry.azurecr.io
      username: ${ACR_USERNAME}
      password: ${ACR_PASSWORD}