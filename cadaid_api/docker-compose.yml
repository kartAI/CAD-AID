services:
  detect:
    build:
      context: .
      dockerfile: detect/Dockerfile
    image: cadaidregistry.azurecr.io/detect:latest
    #image: detect:latest
    environment:
      - LOG_LEVEL=debug
      - PYTHONPATH=/app
      - USE_AZURE_STORAGE=${USE_AZURE_STORAGE:-false}
      - AZURE_STORAGE_CONNECTION_STRING=${AZURE_STORAGE_CONNECTION_STRING}
      - AZURE_STORAGE_CONTAINER=${AZURE_STORAGE_CONTAINER:-cadaid-files}
    volumes:
      - ./detect/src:/app/src
      - ./shared:/app/shared
      - ./upload_files:/app/upload_files
      - ./metadata_files_store:/app/metadata_files_store
    ports:
      - "8000:8000"
    networks:
      - cadaid_network
    #healthcheck:
    #  test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
    #  interval: 30s
    #  timeout: 5s
    #  retries: 3
    #  start_period: 30s

  feedback:
    build:
      context: .
      dockerfile: feedback/Dockerfile
    image: cadaidregistry.azurecr.io/feedback:latest
    environment:
      - LOG_LEVEL=debug
      - PYTHONPATH=/app
      - USE_AZURE_STORAGE=${USE_AZURE_STORAGE:-false}
      - AZURE_STORAGE_CONNECTION_STRING=${AZURE_STORAGE_CONNECTION_STRING}
      - AZURE_STORAGE_CONTAINER=${AZURE_STORAGE_CONTAINER:-cadaid-files}
    volumes:
      - ./feedback/src:/app/src
      - ./shared:/app/shared
      - ./metadata_files_store:/app/metadata_files_store
      - ./upload_files:/app/upload_files
    ports:
      - "8001:8001"
    networks:
      - cadaid_network
    #healthcheck:
    #  test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
    #  interval: 30s
    #  timeout: 5s
    #  retries: 3
    #  start_period: 30s
    depends_on:
      - detect

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    image: cadaidregistry.azurecr.io/nginx:latest
    ports:
      - "80:80"
    depends_on:
      - detect
      - feedback
    networks:
      - cadaid_network

networks:
  cadaid_network:
    driver: bridge