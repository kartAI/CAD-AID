services:
  detect:
    build:
      context: .
      dockerfile: detect/Dockerfile
    image: cadaidregistry.azurecr.io/detect:latest
    #image: detect:latest
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./shared:/app/shared
      - ./shared/static/uploads:/app/static/uploads
    environment:
      - LOG_LEVEL=debug
      - PYTHONPATH=/app:/app/shared
      - STATIC_API_KEY=${STATIC_API_KEY}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - cadaid_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  feedback:
    build:
      context: .
      dockerfile: feedback/Dockerfile
    image: cadaidregistry.azurecr.io/feedback:latest
    #image: feedback:latest
    ports:
      - "8001:8001"
    volumes:
      - .:/app
      - ./shared:/app/shared
      - ./shared/static/uploads:/app/static/uploads
    environment:
      - LOG_LEVEL=debug
      - PYTHONPATH=/app:/app/shared
      - STATIC_API_KEY=${STATIC_API_KEY}
    networks:
      - cadaid_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    image: cadaidregistry.azurecr.io/nginx:latest
    ports:
      - "80:80"
    depends_on:
      detect:
        condition: service_healthy
      feedback:
        condition: service_healthy
    environment:
      - STATIC_API_KEY=${STATIC_API_KEY}
    networks:
      - cadaid_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  cadaid_network:
    driver: bridge