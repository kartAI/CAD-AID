version: "3.8"

services:
  detect:
    build:
      context: .
      dockerfile: detect/Dockerfile
    image: detect:latest
    environment:
      - LOG_LEVEL=debug
      - PYTHONPATH=/app
      - USE_AZURE_STORAGE=false
      - STATIC_API_KEY=local-test-key
    volumes:
      - ./detect/src:/app/src
      - ./shared:/app/shared
      - ./upload_files:/app/upload_files
      - ./metadata_files_store:/app/metadata_files_store
    ports:
      - "8000:8000"
    networks:
      - cadaid_network

  feedback:
    build:
      context: .
      dockerfile: feedback/Dockerfile
    image: feedback:latest
    environment:
      - LOG_LEVEL=debug
      - PYTHONPATH=/app
      - USE_AZURE_STORAGE=false
      - STATIC_API_KEY=local-test-key
    volumes:
      - ./feedback/src:/app/src
      - ./shared:/app/shared
      - ./upload_files:/app/upload_files
      - ./metadata_files_store:/app/metadata_files_store
    ports:
      - "8001:8001"
    depends_on:
      - detect
    networks:
      - cadaid_network

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile.local
    image: nginx-local:latest
    ports:
      - "80:80"  # Keep the same port as production for consistency
    depends_on:
      - detect
      - feedback
    networks:
      - cadaid_network

networks:
  cadaid_network:
    driver: bridge
